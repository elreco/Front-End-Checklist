app = "coderocket-cloud"
primary_region = "cdg"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile.coderocket"

[deploy]
  release_command = "pnpm --filter @coderocket/db migrate"
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  NEXT_PUBLIC_SITE_URL = "https://www.coderocket.app"
  NEXT_PUBLIC_GOOGLE_ANALYTICS_ID = "G-0HBMKNN8MQ"
  CODEROCKET_COMMERCIAL_LAUNCH = "true"
  FRONTEND_CHECKLIST_RULES_DIR = "/app/packages/content/rules/en"

[processes]
  web = "sh -lc 'node scripts/setup/prepare-coderocket-runtime-env.mjs && node apps/cloud/.next/standalone/apps/cloud/server.js'"
  worker = "pnpm --filter @coderocket/worker start"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  processes = ["web"]
  size = "shared-cpu-1x"
  memory = "1gb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "512mb"
