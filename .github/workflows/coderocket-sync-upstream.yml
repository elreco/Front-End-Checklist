name: Sync CodeRocket with upstream

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  mirror-and-open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: coderocket/main
          fetch-depth: 0
      - name: Configure upstream
        run: |
          git remote add upstream https://github.com/thedaviddias/Front-End-Checklist.git
          git fetch upstream main
          git fetch origin main coderocket/main
      - name: Mirror upstream main exactly
        run: git push origin upstream/main:main --force-with-lease=main:$(git rev-parse origin/main)
      - name: Merge the mirror into a sync branch
        id: merge
        run: |
          branch="chore/coderocket-upstream-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch" origin/coderocket/main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-ff upstream/main -m "chore: sync Front-End Checklist upstream"
          git push origin "$branch"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Open product sync pull request
        if: steps.merge.outputs.changed == 'true'
        run: gh pr create --base coderocket/main --head "${{ steps.merge.outputs.branch }}" --title "chore: weekly upstream sync" --body "Automated merge of the exact upstream main mirror into the CodeRocket product branch. CodeRocket CI rebuilds the official rules reference and audit ruleset from the updated corpus. Review shared configuration and lockfile changes before merging."
        env:
          GH_TOKEN: ${{ github.token }}
