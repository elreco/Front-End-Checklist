name: Publish CodeRocket CLI

on:
  push:
    branches: [coderocket/main]
  workflow_dispatch:

concurrency:
  group: publish-coderocket-cli
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - name: Create or update release pull request
        id: changesets
        uses: changesets/action@v1
        with:
          commit: 'chore: release CodeRocket CLI'
          title: 'chore: release CodeRocket CLI'
          version: pnpm version:coderocket-cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether the package version is unpublished
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: npm-version
        working-directory: packages/coderocket-cli
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} is already published."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "${package_name}@${package_version} will be published."
          fi
      - name: Verify CodeRocket CLI
        if: steps.npm-version.outputs.publish == 'true'
        run: |
          pnpm --filter @coderocketapp/cli typecheck
          pnpm --filter @coderocketapp/cli test:ci
          pnpm --filter @coderocketapp/cli build
      - name: Install npm with trusted publishing support
        if: steps.npm-version.outputs.publish == 'true'
        run: npm install --global npm@11
      - name: Publish CodeRocket CLI
        if: steps.npm-version.outputs.publish == 'true'
        working-directory: packages/coderocket-cli
        run: npm publish --access public
