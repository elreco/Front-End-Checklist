name: CodeRocket CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/cloud/**'
      - 'packages/coderocket-*/**'
      - 'packages/design-system/**'
      - 'packages/utils/**'
      - 'configs/config-typescript/**'
      - 'Dockerfile.coderocket'
      - 'fly.coderocket.toml'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint CodeRocket
        run: pnpm lint
      - name: Typecheck CodeRocket
        run: pnpm typecheck
      - name: Test CodeRocket
        run: pnpm test:ci
      - name: Build cloud app
        run: pnpm --filter @coderocket/cloud build
      - name: Build deployment image
        run: docker build -f Dockerfile.coderocket -t coderocket:${{ github.sha }} .
